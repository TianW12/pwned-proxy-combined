# =============================================================================
# Production stack: nginx (TLS + reverse proxy) -> Django backend -> Postgres
# -----------------------------------------------------------------------------
# Start with:  docker compose -f docker-compose.prod.yaml up -d --build
# -----------------------------------------------------------------------------
# Differences vs the base docker-compose.yaml:
#   * adds an nginx service that terminates HTTPS and serves the React frontend
#   * the backend is NO LONGER published on the host (only nginx can reach it)
# =============================================================================

services:
  nginx:
    build:
      context: ./ui
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The server config — edit this file, then `restart nginx` to apply.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates issued by certbot on the host.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot used by certbot to answer the ACME challenge.
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - public
    restart: unless-stopped

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - ./app/.env
    depends_on:
      - db
    # No host port here: only nginx (on the public network) talks to the backend.
    networks:
      - private   # talk to Postgres
      - public    # reachable by nginx
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python scripts/create_admin.py &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --access-logfile -
      --log-level info
      "

  db:
    image: postgres:14-alpine
    env_file:
      - ./app/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private   # only the backend can see this
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  # Isolated; unreachable from the host or other networks
  private:
    internal: true
  # Ordinary bridge; containers on it can reach one another and the Internet
  public:
