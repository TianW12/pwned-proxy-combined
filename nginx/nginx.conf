# =============================================================================
# Pwned Proxy — nginx reverse proxy (production)
# -----------------------------------------------------------------------------
# This file is mounted into the nginx container at
#   /etc/nginx/conf.d/default.conf
# After editing it, apply the change with:  docker compose -f docker-compose.prod.yaml restart nginx
#
# Replace the two placeholder domains below with your own:
#   yoursite.com       -> the public website (React email checker)
#   api.yoursite.com   -> the Django backend (API + /admin + /swagger)
# =============================================================================

# ---- 1. Redirect all plain HTTP (port 80) to HTTPS -------------------------
# The only exception is the /.well-known/acme-challenge/ path, which certbot
# uses to prove you own the domain when issuing/renewing TLS certificates.
server {
    listen 80;
    server_name yoursite.com api.yoursite.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 2. The public website: serves the React app ---------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name yoursite.com;

    ssl_certificate     /etc/letsencrypt/live/yoursite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoursite.com/privkey.pem;

    # Serve the built React files. try_files falls back to index.html so that
    # client-side routes (React Router) don't 404 on refresh.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend calls the backend with relative URLs like /api/v3/...
    # so we forward /api/ from the website to the Django backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OPTIONAL: authenticate the public email checker against the proxy.
        # If you want the website's requests to use the "Master Group" key,
        # uncomment the next line and paste the raw key from seeded_api_keys.json.
        # The browser never sees this key — nginx adds it server-side.
        # proxy_set_header X-API-Key "PASTE_MASTER_GROUP_KEY_HERE";
    }
}

# ---- 3. The API host: Django admin, Swagger, and the raw API ---------------
# External clients (e.g. universities) hit this host directly and send their
# OWN X-API-Key header. Do NOT inject a key here.
server {
    listen 443 ssl;
    http2 on;
    server_name api.yoursite.com;

    ssl_certificate     /etc/letsencrypt/live/yoursite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoursite.com/privkey.pem;

    # Allow larger request bodies (e.g. admin uploads / domain imports).
    client_max_body_size 10m;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This header tells Django the original request was HTTPS. Django trusts
        # it because of SECURE_PROXY_SSL_HEADER in config/settings.py.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
